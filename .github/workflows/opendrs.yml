# Dogfood: score this repository's own PRs and approve the low-risk ones (.opendrs.yml), and
# auto-merge only those that are also a captain "quick confirm", once the required checks pass.
# Runs the RELEASED action (@v0), never the PR's own copy: a PR must not be able to edit the
# code that decides whether to approve it.
name: opendrs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# A newer push cancels the run for the older head, so it cannot approve or merge a stale commit.
concurrency:
  group: opendrs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write # gh pr merge --auto
  pull-requests: write
  checks: read

jobs:
  opendrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required: the score reads past commits, authors and the merge-base
      - uses: error-path/opendrs@v0
        id: opendrs
        with:
          sample-salt: ${{ secrets.OPENDRS_SAMPLE_SALT }}
      - env:
          SCORE: ${{ steps.opendrs.outputs.score }}
          TIER: ${{ steps.opendrs.outputs.tier }}
          DECISION: ${{ steps.opendrs.outputs.decision }}
          CAPTAIN: ${{ steps.opendrs.outputs.captain }}
        run: echo "score=$SCORE tier=$TIER decision=$DECISION captain=$CAPTAIN"
      # The decision and captain come from this run, never from labels: anyone with triage access
      # can add a label. auto-approve already means green with every safety rule passed.
      - name: Auto-merge a green, quick-confirm PR once the required checks pass
        if: steps.opendrs.outputs.decision == 'auto-approve' && steps.opendrs.outputs.captain == 'quick'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
      # Turn it off in every other case, including a failed opendrs step, so a later push that is no
      # longer quick-confirm cannot merge on auto-merge set by an earlier run.
      - name: Otherwise turn auto-merge off
        if: ${{ !cancelled() && !(steps.opendrs.outputs.decision == 'auto-approve' && steps.opendrs.outputs.captain == 'quick') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --disable-auto --repo "$GITHUB_REPOSITORY" || true
