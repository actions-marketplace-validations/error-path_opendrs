name: indexnow

# After GitHub Pages publishes docs/, tell Bing and the other IndexNow engines which pages changed.
# Run it by hand (workflow_dispatch) to submit every page in the sitemap.
on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    env:
      SITE: https://error-path.github.io/opendrs/
      KEY: 7761d20ca5295159e2dd2f14ffccbe2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.build.commit || github.sha }}
          fetch-depth: 2
      - name: Submit changed pages
        run: |
          curl -fsS "${SITE}sitemap.xml?$GITHUB_RUN_ID" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > sitemap-urls
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git diff --name-only HEAD~1 HEAD -- docs/_config.yml docs/_layouts | grep -q .; then
            cp sitemap-urls urls
          else
            git diff --name-only HEAD~1 HEAD -- docs \
              | sed -E "s#^docs/##; s#(^|/)index\.html\$#\1#; s#\.md\$#.html#; s#^#${SITE}#" \
              | grep -Fx -f sitemap-urls > urls || true
          fi
          if [ ! -s urls ]; then echo "No published pages changed."; exit 0; fi
          cat urls
          jq -Rn --arg key "$KEY" --arg site "$SITE" \
            '{host: "error-path.github.io", key: $key, keyLocation: ($site + $key + ".txt"), urlList: [inputs]}' < urls \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -w 'IndexNow HTTP %{http_code}\n'
