name: Feature request
description: A signal, integration or option you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do, and what gets in the way?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What you propose }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: "For a new signal: why it predicts incidents, ideally with backtest numbers." }
