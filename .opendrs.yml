# opendrs scores its own pull requests with these settings. Reference: README, "Configuration".
# The config is always read from the base branch, so a PR cannot change its own gate.
autoApprove:
  enabled: true
  # Approve low-risk PRs. The workflow auto-merges only those whose captain line is "quick
  # confirm" (.github/workflows/opendrs.yml); a maintainer merges the rest.
  mergeMethod: none
  maxChangedLines: 500
